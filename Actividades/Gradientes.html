<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Formas con gradiente</title>
    <link rel="stylesheet" href="../style.css">
  </head>  
  <body>
  <div style="text-align: center;">
    <canvas id="canvas" width="800" height="400"></canvas>
    
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          pt1 = {x: 100, y: 100},           //gradient start point
          pt2 = {x: 600, y: 600},           //gradient end point
          gradient = context.createLinearGradient(pt1.x, pt1.y, pt2.x, pt2.y);



      //white to blue to red
      gradient.addColorStop(0, "#ffffff");
      gradient.addColorStop(0.25, "#6666ff");
      gradient.addColorStop(0.5, "#0000ff");
      gradient.addColorStop(1, "#1100ff");

      
     
 

      context.fillStyle = gradient;
      context.fillRect(100, 100, 600, 300);

      context.fillstyle ="green";
      context.fillRect(100, 100, 800, 300);

      context.beginPath();
      context.arc(100, 75, 50, 0, 2 * Math.PI);
      context.fillstyle = "yellow";
      context.stroke();
      context.fill();
      
    };
    </script>
  </body>
</html>
